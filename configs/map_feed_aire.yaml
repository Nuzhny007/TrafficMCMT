# Map feed for the single-camera Aire highway clip.
#
# The origin is the centroid of the four control points in
# `data/aire/geo_bind.ini`, which is what `GeoBinding` uses when no explicit
# `--geo-origin` is supplied. Older Aire exports predate the origin fields in
# the tracklet protocol, so the value has to come from this config.

feed:
  origin: 45.52724575,5.97433625

  tick_hz: 10
  trail_points: 40
  trail_min_distance_m: 0.3
  velocity_window_s: 1.0
  velocity_max_mps: 70.0
  track_ttl_s: 3.0
  snapshot_interval_s: 0.0
  heartbeat_s: 5.0

cameras:
  - id: cam-01
    camera_id: 1
    color: [56, 189, 248, 55]
    geo_bind: ../data/aire/geo_bind.ini
