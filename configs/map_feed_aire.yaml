# Map feed for the single-camera Aire highway clip.
#
# The origin is the centroid of the four control points in
# `data/aire/geo_bind.ini`, which is what `GeoBinding` uses when no explicit
# `--geo-origin` is supplied. Older Aire exports predate the origin fields in
# the tracklet protocol, so the value has to come from this config.

feed:
  origin: 45.52724575,5.97433625

  tick_hz: 10
  trail_points: 40
  trail_min_distance_m: 0.3
  velocity_window_s: 1.0
  velocity_max_mps: 70.0
  # Highway traffic is fast, but the acceleration estimate is still noisy.
  acceleration_window_s: 1.5
  acceleration_max_mps2: 3.0
  track_ttl_s: 3.0
  snapshot_interval_s: 0.0
  heartbeat_s: 5.0

# Gaussian puff dispersion (stage 2c). Centred on the Aire ENU origin.
emissions:
  enabled: true
  stability_class: D
  wind:
    speed_mps: 3.0
    from_deg: 270
  source_height_m: 0.5
  breathing_height_m: 1.5
  puff_interval_s: 1.0
  max_age_s: 180
  max_puffs: 3000
  pm25_fraction: 0.5
  grid_hz: 1.0
  grid:
    center_lat: 45.52724575
    center_lon: 5.97433625
    width_m: 600
    height_m: 450
    cell_m: 5

cameras:
  - id: cam-01
    camera_id: 1
    color: [56, 189, 248, 55]
    geo_bind: ../data/aire/geo_bind.ini
