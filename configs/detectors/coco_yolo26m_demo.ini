; TrafficMCMT detector preset for the single-camera demo export: YOLO26m on
; COCO, run on the GPU through the Multitarget-tracker ONNX TensorRT backend
; (detector_backend = 5). The Aire clip at confidence 0.55 with YOLOv8s left
; too few real road users on the map, so this preset drops the threshold to
; 0.45 and relies on the stronger model plus the robust-track filter to keep
; phantoms out.
;
; Paths are resolved relative to the process working directory. The run
; scripts change to the repository root before starting the exporter, so
; ../Multitarget-tracker points at the local Multitarget-tracker checkout.
;
; Only road users are kept. Remove or extend `white_list` to export other
; COCO classes.

[detection]

; opencv_dnn = 6, tensorrt = 5
detector_backend = 5

nn_weights = ../Multitarget-tracker/data/coco/yolo26m.onnx
nn_config = ../Multitarget-tracker/data/coco/yolo26m.onnx
class_names = ../Multitarget-tracker/data/coco/coco.names

confidence_threshold = 0.45
max_crop_ratio = 0
max_batch = 1
gpu_id = 0

net_type = YOLOV26
inference_precision = FP16

white_list = person;bicycle;car;motorbike;bus;truck

[tracking]
tracker_type = 0
distance_type = 2
kalman_type = 0
filter_goal = 0
lost_track_type = 0
match_type = 0
use_aceleration = 0
delta_time = 0.033
accel_noise = 0.2
dist_thresh = 0.8
local_cartesian_dist_thresh = 10
min_area_radius_pix = -1
max_lost_time = 10
max_trace_len = 4
detect_abandoned = 0
