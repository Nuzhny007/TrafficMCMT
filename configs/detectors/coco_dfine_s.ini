; TrafficMCMT detector preset: D-FINE-S on COCO via OpenCV DNN.
;
; D-FINE is slower than YOLOv8s on CPU but often more accurate on small
; objects. Paths are resolved relative to the repository root.

[detection]
detector_backend = 6
ocv_dnn_target = DNN_TARGET_CPU
ocv_dnn_backend = DNN_BACKEND_OPENCV

nn_weights = ../Multitarget-tracker/data/coco/dfine_s_obj2coco.onnx
nn_config = ../Multitarget-tracker/data/coco/dfine_s_obj2coco.onnx
class_names = ../Multitarget-tracker/data/coco/coco.names

confidence_threshold = 0.35
max_crop_ratio = 0
max_batch = 1
gpu_id = 0

net_type = DFINE
inference_precision = FP32

white_list = person;bicycle;car;motorbike;bus;truck

[tracking]
tracker_type = 0
distance_type = 2
kalman_type = 0
filter_goal = 0
lost_track_type = 0
match_type = 0
use_aceleration = 0
delta_time = 0.033
accel_noise = 0.2
dist_thresh = 0.8
local_cartesian_dist_thresh = 10
min_area_radius_pix = -1
max_lost_time = 10
max_trace_len = 4
detect_abandoned = 0
