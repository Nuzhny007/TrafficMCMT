; TrafficMCMT detector preset: YOLOv8s on COCO via OpenCV DNN.
;
; Paths are resolved relative to the process working directory. The run
; scripts change to the repository root before starting the exporter, so
; ../Multitarget-tracker points at the local Multitarget-tracker checkout.
;
; Only road users are kept. Remove or extend `white_list` to export other
; COCO classes.

[detection]
detector_backend = 6
ocv_dnn_target = DNN_TARGET_CPU
ocv_dnn_backend = DNN_BACKEND_OPENCV

nn_weights = ../Multitarget-tracker/data/coco/yolov8s.onnx
nn_config = ../Multitarget-tracker/data/coco/yolov8s.onnx
class_names = ../Multitarget-tracker/data/coco/coco.names

confidence_threshold = 0.35
max_crop_ratio = 0
max_batch = 1
gpu_id = 0

net_type = YOLOV8
inference_precision = FP32

white_list = person;bicycle;car;motorbike;bus;truck

[tracking]
tracker_type = 0
distance_type = 2
kalman_type = 0
filter_goal = 0
lost_track_type = 0
match_type = 0
use_aceleration = 0
delta_time = 0.033
accel_noise = 0.2
dist_thresh = 0.8
local_cartesian_dist_thresh = 10
min_area_radius_pix = -1
max_lost_time = 10
max_trace_len = 4
detect_abandoned = 0
