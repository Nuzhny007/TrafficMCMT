# TrafficMCMT camera link model (stage 4).
#
# Zones are polygons in ENU metres in the shared origin of the tracklet
# stream (the same origin used by `mtt_export` / `map_feed`). The tracklet
# protocol does not carry the frame size, so image-space zones are not used.
#
# `default_linked: false` is the safe default: only the directed edges listed
# under `links` are allowed. Add `enabled: false` to forbid an edge explicitly
# when `default_linked` is true.
#
# Measured transition statistics are optional. When `mean_ms` / `stddev_ms` /
# `samples` are omitted, the `fallback` window is used. `st_estimate` fills
# them from labelled pairs.

default_linked: false

fallback:
  min_transition_ms: 0
  max_transition_ms: 120000

# Auburn / Toomer's Corner: two synchronised cameras. Entry/exit zones are
# left empty until calibrated from the common ENU origin; zone gating is
# therefore disabled for this topology.
cameras:
  cam-01: {}
  cam-02: {}

links:
  - from: cam-01
    to: cam-02
    enabled: true
  - from: cam-02
    to: cam-01
    enabled: true
