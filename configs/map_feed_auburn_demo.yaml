# Map feed for the two-camera Auburn / Toomer's Corner demo.
#
# Both cameras were exported with `--geo-origin 32.606456,-85.481891` and the
# same `--start-epoch-ms 1620599040000`, so their world coordinates and
# timestamps line up on one map. The origin below must stay equal to that
# `--geo-origin`, otherwise the two cameras are translated relative to each
# other.
#
# Relative `geo_bind` paths are resolved from the repository root, then from
# this file's directory.

feed:
  origin: 32.606456,-85.481891

  # Frame rate of `tracks_update` deltas.
  tick_hz: 10
  # Bounded trail; the viewer keeps its own copy as well.
  trail_points: 40
  trail_min_distance_m: 0.3
  velocity_window_s: 1.0
  velocity_max_mps: 70.0
  # The tracker's speed derivative is noisy; real road vehicles stay well below
  # 3 m/s^2 and HBEFA is very sensitive to acceleration.
  acceleration_window_s: 1.5
  acceleration_max_mps2: 3.0
  # The export stops at the last real detection, so this TTL is exactly how
  # long the map keeps drawing a frozen marker after a vehicle leaves the frame
  # or slips behind an obstacle. The intersection has a lot of occlusion (trees,
  # the corner gates), so 1 s keeps ghost markers from lingering while still
  # covering the 33 ms frame gap of a continuously detected track.
  track_ttl_s: 1.0
  # 0 disables periodic snapshots (new clients still receive one).
  snapshot_interval_s: 0.0
  heartbeat_s: 5.0

# Gaussian puff dispersion (stage 2c). The grid is centred on the shared ENU
# origin and spans 600 x 450 m with 5 m cells (120 x 90).
emissions:
  enabled: true
  stability_class: D
  wind:
    speed_mps: 2.5
    from_deg: 225
  source_height_m: 0.5
  breathing_height_m: 1.5
  puff_interval_s: 1.0
  max_age_s: 180
  max_puffs: 3000
  pm25_fraction: 0.5
  grid_hz: 1.0
  grid:
    center_lat: 32.606456
    center_lon: -85.481891
    width_m: 600
    height_m: 450
    cell_m: 5

cameras:
  - id: cam-01
    camera_id: 1
    color: [56, 189, 248, 55]
    geo_bind: ../data/auburn_toomer/sync_videos/1_2021-05-09_22_24.ini
  - id: cam-02
    camera_id: 2
    color: [251, 191, 36, 55]
    geo_bind: ../data/auburn_toomer/sync_videos/2_2021-05-09_22_24.ini
